# Alacritty Configuration
general.import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]

[window]
opacity = 0.8
dynamic_padding = false
decorations = "full"
startup_mode = "Windowed"

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 10
y = 10

[font]
size = 13.0
normal = { family = "JetBrainsMono Nerd Font" }
