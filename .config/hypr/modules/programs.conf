
###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$rofiDir = ~/.config/rofi/launchers/type-2
$menu = rofi -show drun -theme $rofiDir/style-menu.rasi
$clipboard = cliphist list | rofi -dmenu -p "Clipboard " -theme $rofiDir/style-clipboard.rasi | cliphist decode | wl-copy

