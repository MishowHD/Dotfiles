
###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$rofiTheme = ~/.config/rofi/launchers/type-2/style-2.rasi
$menu = rofi -show drun -theme $rofiTheme
$clipboard = cliphist list | rofi -dmenu -p "Clipboard " -theme $rofiTheme | cliphist decode | wl-copy

